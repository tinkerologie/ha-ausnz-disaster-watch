name: Issue Labeler

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: 17 3 * * *
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions: {}

jobs:
  label:
    permissions:
      issues: write # add bug/enhancement labels, and create them if missing
    uses: tinkerologie/.github/.github/workflows/issue-labeler.yml@13a80ae8683378c7e811b4f902aa1aabd6cebb6e # v1.4.3
