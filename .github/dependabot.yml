# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      devcontainers-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /
    # Updating pytest-homeassistant also updates the Core version used by bootstrap.
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      pip-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # The Core version used by bootstrap follows the official test plugin pin.
      - dependency-name: homeassistant
      # Feed libraries whose lower bounds match Home Assistant core integrations (#35, #37, #103)
      - dependency-name: aio-geojson-geonetnz-quakes
      - dependency-name: aio-geojson-geonetnz-volcano
      - dependency-name: aio-geojson-nsw-rfs-incidents
      - dependency-name: aio-georss-gdacs

  # Frontend (frontend/package.json and package-lock.json).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
