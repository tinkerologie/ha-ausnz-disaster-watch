name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: Lint
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.9.3
          enable-cache: true
          cache-dependency-glob: '**/requirements*.txt'

      - name: Cache Home Assistant installation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/ha-venv
          key: ha-venv-${{ runner.os }}-${{ runner.environment }}-py314-lint-${{ hashFiles('requirements_dev.txt') }}
          restore-keys: |
            ha-venv-${{ runner.os }}-${{ runner.environment }}-py314-lint-

      - name: Drop a cached venv built under another workspace path
        # Virtualenvs hard-code their absolute path; a cache restored on a runner with a
        # different workspace (another self-hosted runner, or GitHub-hosted) is unusable.
        run: |
          if [ -f .local/ha-venv/bin/activate ] && ! grep -q "$PWD/.local/ha-venv" .local/ha-venv/bin/activate; then
            echo "Cached venv was built elsewhere; recreating it"
            rm -rf .local/ha-venv
          fi

      - name: Install lint dependencies
        run: |
          if [ ! -d .local/ha-venv ] || [ ! -x .local/ha-venv/bin/python3 ]; then
            rm -rf .local/ha-venv
            uv venv .local/ha-venv
          fi
          source .local/ha-venv/bin/activate
          uv pip install --upgrade --requirement requirements_dev.txt
          uv pip install --upgrade ruff

      - name: Lint check
        run: script/lint-check

  backend:
    name: Test
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.9.3
          enable-cache: true
          cache-dependency-glob: '**/requirements*.txt'

      - name: Get Home Assistant version
        id: ha_version
        run: |
          HA_VERSION=$(grep '"homeassistant"' hacs.json | head -1 | sed 's/.*"homeassistant"\s*:\s*"\([^"]*\)".*/\1/')
          echo "HA_VERSION=${HA_VERSION}" >> $GITHUB_OUTPUT
          echo "Home Assistant version: ${HA_VERSION}"

      - name: Cache Home Assistant installation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/ha-venv
          key: ha-venv-${{ runner.os }}-${{ runner.environment }}-py314-ha${{ steps.ha_version.outputs.HA_VERSION }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ha-venv-${{ runner.os }}-${{ runner.environment }}-py314-ha${{ steps.ha_version.outputs.HA_VERSION }}-

      - name: Drop a cached venv built under another workspace path
        # Virtualenvs hard-code their absolute path; a cache restored on a runner with a
        # different workspace (another self-hosted runner, or GitHub-hosted) is unusable.
        run: |
          if [ -f .local/ha-venv/bin/activate ] && ! grep -q "$PWD/.local/ha-venv" .local/ha-venv/bin/activate; then
            echo "Cached venv was built elsewhere; recreating it"
            rm -rf .local/ha-venv
          fi

      - name: Install build tools (self-hosted runner)
        # GitHub-hosted images include these; some Home Assistant test dependencies
        # (for example dtlssocket) are compiled from source and need them.
        if: runner.environment == 'self-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends autoconf automake libtool build-essential pkg-config

      - name: Install dependencies
        run: script/setup/bootstrap

      - name: Run tests
        run: script/test --cov --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # OIDC: no stored token needed (organisation secrets are not exposed to this private repo)
          use_oidc: true
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true

  imports:
    name: Declared requirements
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.9.3
          enable-cache: true
          cache-dependency-glob: '**/requirements*.txt'

      - name: Import every module with only declared requirements
        run: script/check-imports

  frontend:
    name: Frontend
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Modern HA patterns (#42)
        run: npm run lint:modern

      - name: Unit tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Upload screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: card-screenshots
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

      - name: Committed bundle matches source
        run: |
          changes="$(git status --porcelain --untracked-files=all -- ../custom_components/ausnz_disaster_watch/frontend/)"
          if [ -n "$changes" ]; then
            echo "Committed frontend bundle is out of date:"
            echo "$changes"
            git diff -- ../custom_components/ausnz_disaster_watch/frontend/
            exit 1
          fi
