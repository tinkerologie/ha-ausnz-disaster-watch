name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - custom_components/ausnz_disaster_watch/manifest.json

permissions:
  contents: read # jobs request only what they need

# One release run at a time, never cancelled: the tag comes from manifest.json inside the
# job, so runs are serialised as a whole. A run must not delete or publish a draft another
# run is still filling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      contents: read # check out the release commit
      id-token: write # mint the OIDC token that signs the attestation
      attestations: write # store the build provenance attestation
      artifact-metadata: write # create the artifact storage record (actions/attest v4)
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version from manifest
        id: version
        run: |
          VERSION="$(jq -r '.version' custom_components/ausnz_disaster_watch/manifest.json)"

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Manifest version is missing."
            exit 1
          fi

          # Home Assistant versioning: YEAR.MONTH.PATCH, with an optional pre-release suffix
          # (2026.10.0, 2026.10.1, 2026.10.0b0, 2026.10.0rc1)
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Manifest version '$VERSION' does not match YYYY.M.PATCH (optionally with a/b/rc suffix)."
            exit 1
          fi

          # Alpha, beta and release-candidate versions are not published
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip pre-release versions
        if: steps.version.outputs.prerelease == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "::notice::Manifest version ${VERSION} is a pre-release; no GitHub release is created."

      - name: Check if tag already exists
        id: tag
        if: steps.version.outputs.prerelease == 'false'
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${VERSION_TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when release already exists
        if: steps.version.outputs.prerelease == 'false' && steps.tag.outputs.exists == 'true'
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: echo "Tag ${VERSION_TAG} already exists. Skipping release creation."

      - name: Decide whether to release
        id: decide
        env:
          SHOULD_RELEASE: ${{ steps.version.outputs.prerelease == 'false' && steps.tag.outputs.exists == 'false' }}
        run: echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.decide.outputs.should_release == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build release zip
        if: steps.decide.outputs.should_release == 'true'
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Timestamps come from the release commit, so the tag rebuilds byte-identically.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          script/build-release --output-dir dist --version "$VERSION_TAG"

      - name: Attest build provenance
        if: steps.decide.outputs.should_release == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ausnz_disaster_watch.zip

      - name: Upload release assets
        if: steps.decide.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/ausnz_disaster_watch.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    permissions:
      contents: write # create the draft, upload assets, publish the release and tag
      attestations: read # verify the attestation before publishing

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify checksum and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          # The same command the README gives users, pinned to this workflow.
          gh attestation verify dist/ausnz_disaster_watch.zip --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml"

      - name: Extract latest changelog section
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          FOOTER="See [CHANGELOG.md](https://github.com/${REPOSITORY}/blob/${TAG}/CHANGELOG.md) for the full changelog."
          NOTES="$RUNNER_TEMP/release_notes.md"

          emit_notes() {
            echo "----- release notes -----"
            cat "$NOTES"
            echo "-------------------------"
          }

          fallback_notes() {
            {
              echo "Release ${TAG}"
              echo
              echo "---"
              echo
              echo "$FOOTER"
            } > "$NOTES"
            emit_notes
          }

          if [[ ! -f CHANGELOG.md ]]; then
            echo "Release ${TAG}" > "$NOTES"
            emit_notes
            exit 0
          fi

          # Normalize a dotted version by stripping leading zeros from each
          # segment, so the manifest version (2026.6.1) matches zero-padded
          # changelog headings.
          norm() {
            awk -F. -v OFS=. '{ for (i = 1; i <= NF; i++) $i += 0; print }' <<< "$1"
          }

          target="$(norm "$VERSION")"

          # Locate the changelog section for this release: headings look like
          # "## [2026.06.01] - 2026-06-13". Prefer the section matching the
          # manifest version; fall back to the first versioned section.
          start="" end="" first_start="" first_end=""
          while IFS=: read -r lineno text; do
            if [[ -n "$start" && -z "$end" && "$lineno" -gt "$start" ]]; then
              end="$lineno"
            fi
            if [[ -n "$first_start" && -z "$first_end" && "$lineno" -gt "$first_start" ]]; then
              first_end="$lineno"
            fi
            ver="$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' <<< "$text")"
            [[ -z "$ver" ]] && continue
            [[ -z "$first_start" ]] && first_start="$lineno"
            if [[ -z "$start" && "$(norm "$ver")" == "$target" ]]; then
              start="$lineno"
            fi
          done < <(grep -n '^## \[' CHANGELOG.md)

          if [[ -z "$start" ]]; then
            echo "No changelog section found for version ${VERSION}; falling back to the first versioned section."
            start="$first_start"
            end="$first_end"
          fi

          if [[ -z "$start" ]]; then
            echo "No versioned changelog section found at all."
            fallback_notes
            exit 0
          fi

          if [[ -n "$end" ]]; then
            sed -n "$((start + 1)),$((end - 1))p" CHANGELOG.md > "$RUNNER_TEMP/section.md"
          else
            sed -n "$((start + 1)),\$p" CHANGELOG.md > "$RUNNER_TEMP/section.md"
          fi

          # Trim leading and trailing blank lines
          awk 'NF { seen = 1 } seen' "$RUNNER_TEMP/section.md" | tac | awk 'NF { seen = 1 } seen' | tac > "$NOTES"

          if [[ ! -s "$NOTES" ]]; then
            echo "Matched changelog section is empty."
            fallback_notes
            exit 0
          fi

          {
            echo
            echo "---"
            echo
            echo "$FOOTER"
          } >> "$NOTES"

          emit_notes

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # The tag only exists once a release is published, so a release found here is
          # either a draft an earlier failed run left behind (delete it, so this run starts
          # from one clean draft) or a published release the tag check missed (stop).
          if IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$IS_DRAFT" == "true" ]]; then
              echo "Deleting the draft release ${TAG} left by an earlier run."
              gh release delete "$TAG" --yes
            else
              echo "::error::Release ${TAG} is already published, but the tag check found no tag."
              exit 1
            fi
          fi
          # Immutable releases lock assets on publish, so upload to a draft first.
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            dist/ausnz_disaster_watch.zip \
            dist/SHA256SUMS \
            CHANGELOG.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Verify the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # GitHub creates the release attestation shortly after publication, so retry for
          # about a minute. A release published without immutability never gets one, so the
          # step still fails and the setting can't lapse unnoticed.
          for attempt in $(seq 1 12); do
            if gh release verify "$TAG"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::No release attestation for $TAG. Is release immutability enabled?"
              exit 1
            fi
            echo "Release attestation not available yet (attempt $attempt/12); retrying in 5 seconds."
            sleep 5
          done
          gh release verify-asset "$TAG" dist/ausnz_disaster_watch.zip
