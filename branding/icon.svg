<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Australia and New Zealand Disaster Watch: master icon (transparent background). -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA24A"/>
      <stop offset="1" stop-color="#E23A1E"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4472"/>
      <stop offset="1" stop-color="#091831"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB766"/>
      <stop offset="1" stop-color="#F04A1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06101F" flood-opacity="0.3"/>
    </filter>
    <clipPath id="inside">
      <path d="M256 72 L414 127 C414 262 366 358 256 436 C146 358 98 262 98 127 Z"/>
    </clipPath>
    <!-- One five-pointed star of outer radius 1 -->
    <path id="star" d="M0 -1 L0.2245 -0.309 L0.951 -0.309 L0.3633 0.118 L0.5878 0.809 L0 0.382 L-0.5878 0.809 L-0.3633 0.118 L-0.951 -0.309 L-0.2245 -0.309 Z"/>
  </defs>

  <!-- Shield: warm rim around a deep navy field -->
  <path d="M256 36 L444 102 C444 268 386 382 256 474 C126 382 68 268 68 102 Z" fill="url(#rim)" filter="url(#shadow)"/>
  <path d="M256 72 L414 127 C414 262 366 358 256 436 C146 358 98 262 98 127 Z" fill="url(#field)"/>

  <g clip-path="url(#inside)">
    <circle cx="256" cy="214" r="120" fill="url(#glow)"/>

    <!-- Broadcast waves either side of the beacon -->
    <g fill="none" stroke-linecap="round">
      <path d="M194 168 A 70 70 0 0 0 194 260" stroke="#FFC48A" stroke-width="13"/>
      <path d="M318 168 A 70 70 0 0 1 318 260" stroke="#FFC48A" stroke-width="13"/>
      <path d="M162 146 A 104 104 0 0 0 162 282" stroke="#FF9A3C" stroke-width="12" opacity="0.85"/>
      <path d="M350 146 A 104 104 0 0 1 350 282" stroke="#FF9A3C" stroke-width="12" opacity="0.85"/>
    </g>

    <!-- Emergency beacon -->
    <path d="M220 246 L220 214 A 36 36 0 0 1 292 214 L292 246 Z" fill="url(#dome)"/>
    <path d="M238 212 A 20 20 0 0 1 254 194" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <rect x="204" y="246" width="104" height="20" rx="7" fill="#FFFFFF"/>

    <!-- Southern Cross (kite shape: Gacrux top, Acrux bottom, Mimosa left, Delta right, small Epsilon) -->
    <g fill="#FFFFFF">
      <use href="#star" transform="translate(258 300) scale(13)"/>
      <use href="#star" transform="translate(256 384) scale(15)"/>
      <use href="#star" transform="translate(220 334) scale(12)"/>
      <use href="#star" transform="translate(292 326) scale(10.5)"/>
      <use href="#star" transform="translate(278 352) scale(6)"/>
    </g>
  </g>

  <!-- Subtle sheen on the upper shield -->
  <path d="M256 72 L414 127 C414 170 409 205 398 238 L114 238 C103 205 98 170 98 127 Z" fill="url(#sheen)"/>
</svg>
