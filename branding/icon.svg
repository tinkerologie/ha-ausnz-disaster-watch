<svg xmlns="http://www.w3.org/2005/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Badge / Shield Background -->
  <rect x="66" y="48" width="380" height="416" rx="52" fill="url(#shieldGrad)" stroke="#ea580c" stroke-width="8" filter="url(#shadow)"/>

  <!-- Inner Border Line -->
  <rect x="86" y="68" width="340" height="376" rx="36" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Radar Wave Arcs -->
  <path d="M 176 220 A 80 80 0 0 1 336 220" fill="none" stroke="#f97316" stroke-width="5" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M 136 220 A 120 120 0 0 1 376 220" fill="none" stroke="#f97316" stroke-width="6" opacity="0.8"/>
  <path d="M 96 220 A 160 160 0 0 1 416 220" fill="none" stroke="#f97316" stroke-width="7" opacity="0.95"/>

  <!-- Emergency Warning Triangle Beacon -->
  <polygon points="256,130 160,296 352,296" fill="url(#beaconGrad)" stroke="#fed7aa" stroke-width="6" stroke-linejoin="round"/>

  <!-- Exclamation Symbol -->
  <rect x="246" y="172" width="20" height="64" rx="10" fill="#ffffff"/>
  <circle cx="256" cy="264" r="11" fill="#ffffff"/>

  <!-- Jurisdiction Indicators (AU & NZ) -->
  <circle cx="170" cy="360" r="14" fill="#3b82f6" stroke="#93c5fd" stroke-width="3"/>
  <text x="170" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">AU</text>

  <circle cx="342" cy="360" r="14" fill="#ef4444" stroke="#fca5a5" stroke-width="3"/>
  <text x="342" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">NZ</text>

  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="3" text-anchor="middle">DISASTER WATCH</text>
</svg>
