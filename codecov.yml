# Codecov: coverage must not drop, and new or changed lines must be fully tested.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: 100%
comment:
  layout: "condensed_header, diff, files"
  require_changes: false
ignore:
  - "tests/**"
  - "frontend/**"
